# B-058 / ADR-035: every pull request and every push to main is checked on Linux and macOS, the container image is built and
# started, and the dependencies are audited. No model key is used anywhere: the image is tested against a fake model server.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest,  python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  web:
    name: Frontend tests and build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    name: Container image builds and passes the smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fmea:ci .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start the fake model server and the container
        run: |
          python scripts/fake_model_server.py --port 9100 &
          docker run -d --name fmea --network host -e FMEA_COOKIE_SECURE=0 fmea:ci
          for i in $(seq 1 40); do
            curl -fs http://127.0.0.1:8000/api/health && break
            sleep 2
          done
      - name: Smoke test
        run: python scripts/smoke_container.py --base http://127.0.0.1:8000 --model-url http://127.0.0.1:9100/v1
      - name: Container log (on failure)
        if: failure()
        run: docker logs fmea || true

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python packages (fails on a known vulnerability)
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt
      - name: Shipped frontend packages (fails on high or critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend development tools (reported, does not fail)
        working-directory: frontend
        run: npm audit || true
